jobs-create:
  post:
    tags:
      - job
    summary: Create a new job
    operationId: createJob
    requestBody:
      description: Handle and RightId
      content:
        application/json:
          schema:
            $ref: 'item.model.yaml#/ItemSearch'
    parameters:
      - name: format
        in: query
        schema:
          $ref: 'job.model.yaml#/components/schemas/ExportFormatRest'
    responses:
      201:
        description: Created
        content:
          application/json:
            schema:
              $ref: 'job.model.yaml#/JobCreatedRest'
      400:
        description: Bad request
        content:
          application/json:
            schema:
              $ref: 'errorhandling.model.yaml#/ErrorRest'
      401:
        description: Unauthorized to perform this action
        content:
          application/json:
            schema:
              $ref: 'errorhandling.model.yaml#/ErrorRest'

      500:
        description: Internal error
        content:
          application/json:
            schema:
              $ref: 'errorhandling.model.yaml#/ErrorRest'
    x-codegen-request-body-name: body

jobs-status:
  get:
    tags:
      - job
    summary: Get status a job
    operationId: getJobStatus
    parameters:
      - name: job-id
        in: path
        description: Job-Id
        required: true
        schema:
          type: string
    responses:
      200:
        description: Return of status was successful
        content:
          application/json:
            schema:
              $ref: 'job.model.yaml#/JobStatusUpdateRest'
      400:
        description: Bad request
        content:
          application/json:
            schema:
              $ref: 'errorhandling.model.yaml#/ErrorRest'
      404:
        description: Relation does not exist
        content:
          application/json:
            schema:
              $ref: 'errorhandling.model.yaml#/ErrorRest'
      500:
        description: Internal error
        content:
          application/json:
            schema:
              $ref: 'errorhandling.model.yaml#/ErrorRest'