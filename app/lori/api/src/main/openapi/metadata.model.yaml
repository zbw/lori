PublicationTypeRest:
  type: string
  enum:
    - article
    - book
    - book_part
    - conference_paper
    - periodical_part
    - proceeding
    - research_report
    - thesis
    - working_paper
    - other

MetadataRest:
  required:
    - handle
    - publicationType
    - title
    - deleted
  type: object
  properties:
    collectionHandle:
      type: string
    collectionName:
      type: string
    communityHandle:
      type: string
    communityName:
      type: string
    createdBy:
      type: string
    createdOn:
      type: string
      format: date-time
    deleted:
      type: boolean
    doi:
      type: array
      items:
        type: string
    econbizid:
      type: string
    econstorIssue:
      type: string
    econstorVolume:
      type: string
    enumeration:
      type: string
    handle:
      type: string
    isbn:
      type: array
      items:
        type: string
    issn:
      type: array
      items:
        type: string
    isPartOfBook:
      type: string
    isPartOfJournal:
      type: string
    isPartOfSeries:
      type: array
      items:
        type: string
    lastUpdatedBy:
      type: string
    lastUpdatedOn:
      type: string
      format: date-time
    licenceUrl:
      type: string
    paketSigel:
      type: array
      items:
        type: string
    ppn:
      type: string
    ppnBook:
      type: string
    ppnJournal:
      type: string
    ppnSeries:
      type: string
    publicationType:
      $ref: 'metadata.model.yaml#/PublicationTypeRest'
    publicationYear:
      type: integer
    subCommunityHandle:
      type: string
    subCommunityName:
      type: string
    storageDate:
      type: string
      format: date-time
    title:
      type: string
    zdbIds:
      type: array
      items:
        type: string
